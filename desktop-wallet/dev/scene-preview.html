<!doctype html><meta charset="utf-8"><title>QLight Three scene preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#081325}canvas{width:100%;height:100%;display:block}aside{position:fixed;left:20px;top:18px;color:#fff3d0;font:14px system-ui;background:#071427c9;padding:12px 16px;border:1px solid #eac47788;z-index:5}.grade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(4,8,18,.38) 100%),linear-gradient(0deg,rgba(28,16,8,.22),transparent 34%)}</style>
<canvas id="view"></canvas><div class="grade"></div><aside id="hud">QLIGHT · THREE WORLD VISUAL CHECK</aside>
<script src="../ui/sprites.js"></script><script src="../ui/qlight-hd-sprites.js"></script><script src="../ui/terrain-tex.js"></script><script src="../ui/earth-height.js"></script><script src="../ui/world.js"></script>
<script type="module">
import {ThreeWorld} from './world3d-three.js';
const r=QLWorld.render(QLWorld.seedWords(QLWorld.GENESIS_HASH,[]));
const scene=new ThreeWorld(document.getElementById('view'));
scene.setWorld(r.heights,r.blocks,[],[],[]);
const W=QLWorld.W, H=QLWorld.H, k=(x,z)=>z*W+x, seaLv=QLWorld.RULES.SEA>>3;
// 与 app.js pickSpawn 逐字同一套评分：预览的第一帧 = 玩家进世界的第一眼
const kindAt=(x,z)=>r.blocks[k(x,z)]&7, lvl=(x,z)=>r.heights[k(x,z)]>>3, isWater=(x,z)=>kindAt(x,z)===0, isTree=(x,z)=>(r.blocks[k(x,z)]&8)!==0;
const at=(ax,az)=>[Math.min(W-1,Math.max(0,ax)),Math.min(H-1,Math.max(0,az))];
let spawn={x:128,z:128,yaw:0.6}, best=-1e9, soft=null, softBest=-1e9;
for(let dz=-46;dz<=46;dz++)for(let dx=-46;dx<=46;dx++){
  const cx=128+dx, cz=128+dz;
  if(cx<8||cz<8||cx>=W-8||cz>=H-8)continue;
  if(isWater(cx,cz)||kindAt(cx,cz)===2)continue;
  const lv=lvl(cx,cz); if(lv<seaLv+2)continue;
  let span=0,steps=0,tot=0,wet=0,woods=0,buried=false;
  for(let gz=-9;gz<=9&&!buried;gz++)for(let gx=-9;gx<=9;gx++){
    if(gx*gx+gz*gz>81)continue;
    const nx=cx+gx,nz=cz+gz,v=lvl(nx,nz),d=Math.abs(v-lv);
    tot++;if(d>0)steps++;if(d>span)span=d;
    if(isWater(nx,nz))wet++;
    if(isTree(nx,nz)){woods++;if(gx*gx+gz*gz<=9)buried=true;}
  }
  let faceYaw=0.6,fs=-1e9;
  for(let a=0;a<8;a++){
    const ux=Math.cos(a*Math.PI/4), uz=Math.sin(a*Math.PI/4);
    let edge=99,maxEl=-99,wD=99,near=0,far=0;
    for(let d=1;d<=50;d++){
      const [nx,nz]=at(cx+Math.round(ux*d),cz+Math.round(uz*d));
      const el=Math.atan2(lvl(nx,nz)+1-(lv+2.62),d)*180/Math.PI;if(el>maxEl)maxEl=el;
      if(edge===99&&lv-lvl(nx,nz)>=2)edge=d;
      if(wD===99&&isWater(nx,nz))wD=d;
      if(isTree(nx,nz)){if(d<=16)near++;if(d<=30)far++;}
    }
    let s=edge>=22?9:edge>=15?5:edge>=10?0:-12;
    s+=maxEl<4?5:maxEl<8?2:maxEl<14?-2:-9;
    s+=(wD>=26&&wD<=48)?7:(wD>=16?2:wD<16?-9:0);
    s-=near*2.2+far*0.7;
    if(s>fs){fs=s;faceYaw=Math.atan2(ux,uz);}
  }
  const rim=Math.min(cx,cz,W-1-cx,H-1-cz);
  const score=fs+(lv-seaLv)*0.25+(kindAt(cx,cz)===5?1.5:0)-woods*0.35
    -Math.hypot(dx,dz)*0.06-steps*0.06-(rim<40?(40-rim)*0.35:0);
  const cand={x:cx,z:cz,yaw:faceYaw};
  if(buried||wet>0||span>2||steps>tot*0.34||woods>16||fs<8){if(score>softBest){softBest=score;soft=cand;}continue;}
  if(score>best){best=score;spawn=cand;}
}
if(best<=-1e9&&soft)spawn=soft;
const q=new URLSearchParams(location.search);
if(q.get('px'))spawn={x:+q.get('px'),z:+q.get('pz'),yaw:spawn.yaw};   // 保住打分出来的朝向，否则 yaw 变 NaN
scene.setSpawn(spawn.x,spawn.z);
if(q.get('shadow')==='0')scene.renderer.shadowMap.enabled=false;
const preset=q.get('t')||'dusk';
const times={day:{day:1,dusk:0},dusk:{day:0.55,dusk:0.95},night:{day:0.06,dusk:0.2}};
const ty=times[preset]||times.dusk;
// py 是"脚底"不是"层号"：站的面在 layer+1，world3d.js 的 state() 就是这么给的。
// 之前写成 >>3 等于把相机埋进地下一米，近处顶面全在头顶，画面看到的是地形剖面
// 和漏出来的海平面——所有"地上有蓝色""地面是空的"的判断都被这一米带偏了。
const s={px:spawn.x+0.5,py:(r.heights[k(spawn.x,spawn.z)]>>3)+1,pz:spawn.z+0.5,yaw:q.get('yaw')!=null?+q.get('yaw'):spawn.yaw,pitch:q.get('pitch')!=null?+q.get('pitch'):-0.05,day:ty.day,dusk:ty.dusk,target:null,
  held:q.get('held')!=null?+q.get('held'):null,speed:+(q.get('speed')||0),bob:+(q.get('bob')||0),bobY:+(q.get('bobY')||0),punch:0,above:+(q.get('above')||0)};
document.getElementById('hud').textContent=`QLIGHT · ${preset.toUpperCase()} · SPAWN ${spawn.x},${spawn.z}`;
// 无头截图必须能封顶帧数：swiftshader 一帧几秒，rAF 永动机会把 --virtual-time-budget 拖成永远不落地。
// 且必须等贴图落地再开画：材质采样到空纹理时整片世界是黑的，截图会把时序误判成光照 bug。
const maxFrames=+(q.get('frames')||0);
let drawn=0, waited=0;
function step(){
  if(!scene.texturesReady&&waited++<400){requestAnimationFrame(step);return;}
  scene.render(s);drawn++;
  if(drawn===1){
    // 第一帧画完再回填：region 是 render 里才定的，"脚下这格到底画没画"必须拿真值对
    const hud=document.getElementById('hud');
    hud.textContent+=` · lv ${scene.level(spawn.x,spawn.z)} feet ${s.py} eye ${(s.py+1.62).toFixed(2)} region ${scene.region.join(',')}`;
  }
  if(!maxFrames||drawn<maxFrames)requestAnimationFrame(step);
}
step();
// 浏览器面板被遮住时 rAF 一帧都不走（document.hidden），截图会拿到空缓冲。
// 挂一个手动渲染口：调用方自己决定画几帧，画完立刻读像素，不依赖可见性。
let manual = 0;
window.__ql = {scene, s, spawn, render(n){for(let i=0;i<(n||1);i++)scene.render(s);return ++manual;}};
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')s.yaw-=.1;if(e.key==='ArrowRight')s.yaw+=.1;if(e.key==='ArrowUp')s.pitch=Math.min(1.2,s.pitch+.1);if(e.key==='ArrowDown')s.pitch=Math.max(-1.2,s.pitch-.1);});
// ?survey=1：全图普查"第一眼是不是一堵墙"。出生点的判据靠单点截图试是试不出来的——
// 一次跑遍 256×256，把每个候选的脚下平整度和面朝方向的地形剖面打出来，再挑构图。
if(q.get('survey'))setTimeout(()=>{
  const at=(ax,az)=>[Math.min(W-1,Math.max(0,ax)),Math.min(H-1,Math.max(0,az))];
  const rows=[];let nDry=0,nFlat8=0;
  for(let cz=6;cz<H-6;cz+=2)for(let cx=6;cx<W-6;cx+=2){
    if(isWater(cx,cz)||kindAt(cx,cz)===2)continue;
    const lv=lvl(cx,cz);if(lv<seaLv+2)continue;
    // 脚下 8 格必须是一块平地：近景里每一道一格的落差都会画成一堵土墙，
    // 第一帧的前景就成了"一地泥条"，草地贴图根本没机会露出来
    let span8=0,steps8=0,wet8=0,tot8=0;
    for(let gz=-8;gz<=8;gz++)for(let gx=-8;gx<=8;gx++){
      if(gx*gx+gz*gz>64)continue;
      const [nx,nz]=at(cx+gx,cz+gz),v=lvl(nx,nz),d=Math.abs(v-lv);
      tot8++;if(d>0)steps8++;if(d>span8)span8=d;if(isWater(nx,nz))wet8++;
    }
    if(wet8===0)nDry++;
    if(!(span8<=1&&steps8<=Math.round(tot8*0.12)&&wet8===0))continue;
    nFlat8++;
    let woods=0,canopy=0,buried=false;
    for(let tz=-10;tz<=10&&!buried;tz++)for(let tx=-10;tx<=10;tx++){
      const nx=cx+tx,nz=cz+tz;if(nx<0||nz<0||nx>=W||nz>=H||!isTree(nx,nz))continue;
      const d=Math.max(Math.abs(tx),Math.abs(tz));
      if(d<=2){buried=true;break;}if(d<=4)woods++;else canopy++;
    }
    if(buried||woods>14||canopy>46)continue;
    // 八个方向找"看得出去"的那一眼：8 格内不许有落差，落差要落在 10–22 格的远处
    let face={x:0,z:1},fs=-1e9,prof=[];
    for(let a=0;a<8;a++){
      const ux=Math.cos(a*Math.PI/4),uz=Math.sin(a*Math.PI/4);
      let blind=0,jump=0,seenWater=0;const line=[];
      for(let d=0;d<=24;d+=2){
        const [nx,nz]=at(cx+Math.round(ux*d),cz+Math.round(uz*d));line.push(lvl(nx,nz)-lv);
        if(d>=2&&isWater(nx,nz))seenWater++;
      }
      for(let d=2;d<=14;d++)for(let o=-2;o<=2;o++){
        const bx=Math.round(cx+ux*d-uz*o),bz=Math.round(cz+uz*d+ux*o);
        if(bx<0||bz<0||bx>=W||bz>=H)continue;if(isTree(bx,bz))blind++;
      }
      jump=Math.abs(line[4]-0); // 8 格处就有高差 = 前景一堵墙
      const drop14=line[7],drop22=line[11];
      const s2=Math.min(4,Math.max(0,drop14))*2+Math.min(3,Math.max(0,drop22))*0.8+seenWater*0.5
        -Math.max(0,drop14-4)*3-jump*4-blind*1.5;
      if(s2>fs){fs=s2;face={x:ux,z:uz};prof=line;}
    }
    if(fs<=0)continue;
    rows.push({x:cx,z:cz,lv,fs:+fs.toFixed(2),span8,steps8,yaw:+Math.atan2(face.x,face.z).toFixed(2),prof:prof.join(' ')});
  }
  rows.sort((a,b)=>b.fs-a.fs);
  document.getElementById('hud').textContent='SURVEY '+JSON.stringify({dryNoWater:nDry,flatPocket:nFlat8,kept:rows.length,top:rows.slice(0,10)});
},1200);
// ?probe=1：把灯光/色调映射的真实数值打出来。"远处的树是剪影"这类问题靠猜是猜不出来的。
if(q.get('probe'))setTimeout(()=>{const pick=(o)=>o.type+'|'+(o.material&&o.material.color?o.material.color.getHexString():'-')+'|vc'+(o.material&&o.material.vertexColors?'1':'0')+'|em'+(o.material&&o.material.emissiveIntensity!==undefined?o.material.emissiveIntensity.toFixed(2):'-');
const props=[];scene.props.traverse(o=>{if(o.isMesh&&props.length<6)props.push(pick(o));});
document.getElementById('hud').textContent='PROBE '+JSON.stringify({
 sun:{i:+scene.sun.intensity.toFixed(2),c:scene.sun.color.getHexString(),pos:scene.sun.position.toArray().map(v=>+v.toFixed(1)),inScene:scene.sun.parent===scene.scene,target:scene.sun.target.uuid===undefined?null:'set'},
 hemi:{i:+scene.hemi.intensity.toFixed(2),c:scene.hemi.color.getHexString(),g:scene.hemi.groundColor.getHexString(),inScene:scene.hemi.parent===scene.scene},
 envI:+scene.scene.environmentIntensity.toFixed(2),envMap:!!scene.scene.environment,
 tone:scene.renderer.toneMapping,exp:+scene.renderer.toneMappingExposure.toFixed(2),shadows:scene.renderer.shadowMap.enabled,
 fog:{d:+scene.scene.fog.density.toFixed(4),c:scene.scene.fog.color.getHexString()},
 cam:scene.camera.position.toArray().map(v=>+v.toFixed(1)),lights:scene.scene.children.filter(o=>o.isLight).map(o=>o.type+':'+o.intensity.toFixed(2)),
 texReady:scene.texturesReady,texLeft:scene.texturesLeft,waited,drawn,
 props,matCount:scene.materials?scene.materials.size:-1,drawCalls:scene.renderer.info.render.calls,tris:scene.renderer.info.render.triangles,
 // "脚下有蓝色"这类判断必须拿相机下的真地形对：harness 与渲染器各算一次 level 就能看出谁在说谎
 under:{feet:s.py,eye:+(s.py+1.62).toFixed(2),region:scene.region,lvUnder:scene.level(spawn.x,spawn.z),
   grid:(()=>{const g=[];for(let dz=-2;dz<=2;dz++){const row=[];for(let dx=-2;dx<=2;dx++){const x=spawn.x+dx,z=spawn.z+dz;
     row.push((r.blocks[k(x,z)]&7)+'/'+(r.heights[k(x,z)]>>3)+(isTree(x,z)?'t':''));}g.push(row.join(' '));}return g;})(),
   wetNear:(()=>{const o=[];for(let dz=-10;dz<=10;dz++)for(let dx=-10;dx<=10;dx++){const x=spawn.x+dx,z=spawn.z+dz;
     if(x<0||z<0||x>=W||z>=H)continue;if(isWater(x,z))o.push(dx+','+dz+':'+(r.heights[k(x,z)]>>3));}return o.slice(0,12);})()}
});},900);
</script>
