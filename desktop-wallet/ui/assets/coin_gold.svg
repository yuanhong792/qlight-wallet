  <circle cx="32" cy="32" r="22" fill="none" stroke="#7A5410" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#F2D47F" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1.6 2.6"/>
