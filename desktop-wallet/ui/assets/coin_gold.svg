      <stop offset="0" stop-color="#F3D98C"/>
      <stop offset="0.55" stop-color="#D9A832"/>
      <stop offset="1" stop-color="#8A5C10"/>
    </radialGradient>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FBE7A8"/>
      <stop offset="0.45" stop-color="#E3B54A"/>
      <stop offset="1" stop-color="#A87A18"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
