<!doctype html><meta charset="utf-8"><title>QLight Three scene preview</title>
<style>html,body{margin:0;width:100%;height:100%;background:#081325}canvas{width:100%;height:100%;display:block}aside{position:fixed;left:20px;top:18px;color:#fff3d0;font:14px system-ui;background:#071427c9;padding:12px 16px;border:1px solid #eac47788;z-index:5}.grade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(4,8,18,.38) 100%),linear-gradient(0deg,rgba(28,16,8,.22),transparent 34%)}</style>
<canvas id="view"></canvas><div class="grade"></div><aside id="hud">QLIGHT · THREE WORLD VISUAL CHECK</aside>
<script src="sprites.js"></script><script src="qlight-hd-sprites.js"></script><script src="terrain-tex.js"></script><script src="world.js"></script>
<script type="module">
import {ThreeWorld} from './world3d-three.js';
const r=QLWorld.render(QLWorld.seedWords(QLWorld.GENESIS_HASH,[]));
const scene=new ThreeWorld(document.getElementById('view'));
scene.setWorld(r.heights,r.blocks,[],[],[]);
const W=QLWorld.W, H=QLWorld.H, k=(x,z)=>z*W+x, seaLv=QLWorld.RULES.SEA>>3;
// 与 app.js pickSpawn 同一套评分：预览看到的构图 = 玩家进世界看到的第一眼
const kindAt=(x,z)=>r.blocks[k(x,z)]&7, lvl=(x,z)=>r.heights[k(x,z)]>>3, isWater=(x,z)=>kindAt(x,z)===0, isTree=(x,z)=>(r.blocks[k(x,z)]&8)!==0;
let spawn={x:128,z:128,yaw:0.6}, best=-1e9;
for(let dz=-34;dz<=34;dz+=2)for(let dx=-34;dx<=34;dx+=2){
  const cx=Math.min(W-7,Math.max(6,128+dx)), cz=Math.min(H-7,Math.max(6,128+dz));
  if(isWater(cx,cz)||kindAt(cx,cz)===2)continue;
  const lv=lvl(cx,cz); if(lv<seaLv+2)continue;
  let woods=0,buried=false;
  for(let tz=-4;tz<=4&&!buried;tz++)for(let tx=-4;tx<=4;tx++){
    const nx=cx+tx,nz=cz+tz; if(nx<0||nz<0||nx>=W||nz>=H||!isTree(nx,nz))continue;
    if(Math.abs(tx)<=2&&Math.abs(tz)<=2){buried=true;break;} woods++;
  }
  if(buried)continue;
  const at=(ax,az)=>[Math.min(W-1,Math.max(0,ax)),Math.min(H-1,Math.max(0,az))];
  let walls=0;
  for(let a=0;a<8;a++){
    const [nx,nz]=at(cx+Math.round(Math.cos(a*Math.PI/4)*2),cz+Math.round(Math.sin(a*Math.PI/4)*2));
    walls+=Math.max(0,lvl(nx,nz)-lv);
  }
  if(walls>0)continue;
  let vista=0,near=0,face={x:0,z:1},fs=-1e9;
  for(let a=0;a<8;a++){
    const ux=Math.cos(a*Math.PI/4), uz=Math.sin(a*Math.PI/4);
    const [n5x,n5z]=at(cx+Math.round(ux*5),cz+Math.round(uz*5));
    const [n12x,n12z]=at(cx+Math.round(ux*12),cz+Math.round(uz*12));
    const d5=Math.max(0,lv-lvl(n5x,n5z)), d12=Math.max(0,lv-lvl(n12x,n12z));
    vista+=d12; if(isWater(n12x,n12z))near++;
    const s2=d5*1.6+d12+(isWater(n12x,n12z)?2.4:0)+(isWater(n5x,n5z)?1.2:0);
    if(s2>fs){fs=s2;face={x:ux,z:uz};}
  }
  const score=vista*1.4+near*2.2+(lv-seaLv)*1.0-Math.hypot(dx,dz)*0.3-woods*2.5+((r.blocks[k(cx,cz)]&7)===5?1.5:0);
  if(score>best){best=score;spawn={x:cx,z:cz,yaw:Math.atan2(face.x,face.z)};}
}
scene.setSpawn(spawn.x,spawn.z);
const q=new URLSearchParams(location.search);
if(q.get('shadow')==='0')scene.renderer.shadowMap.enabled=false;
if(q.get('px'))spawn={x:+q.get('px'),z:+q.get('pz')};
const preset=q.get('t')||'dusk';
const times={day:{day:1,dusk:0},dusk:{day:0.55,dusk:0.95},night:{day:0.06,dusk:0.2}};
const ty=times[preset]||times.dusk;
const s={px:spawn.x+0.5,py:(r.heights[k(spawn.x,spawn.z)]>>3),pz:spawn.z+0.5,yaw:q.get('yaw')!=null?+q.get('yaw'):spawn.yaw,pitch:q.get('pitch')!=null?+q.get('pitch'):-0.05,day:ty.day,dusk:ty.dusk,target:null};
document.getElementById('hud').textContent=`QLIGHT · ${preset.toUpperCase()} · SPAWN ${spawn.x},${spawn.z}`;
function draw(){scene.render(s);requestAnimationFrame(draw)} draw();
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')s.yaw-=.1;if(e.key==='ArrowRight')s.yaw+=.1;if(e.key==='ArrowUp')s.pitch=Math.min(1.2,s.pitch+.1);if(e.key==='ArrowDown')s.pitch=Math.max(-1.2,s.pitch-.1);});
</script>
