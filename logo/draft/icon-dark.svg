<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="boltG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#FDE047" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0A0E27"/>

  <!-- 量子轨道 -->
  <circle cx="30" cy="30" r="21.5" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Q 环 -->
  <circle cx="30" cy="30" r="16" fill="none" stroke="url(#ringG)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 贯穿闪电（暗边 + 主体） -->
  <path d="M31.35 10 L17.85 34 L30 34 L28.65 50 L42.15 26 L30 26 Z" fill="#0A0E27" stroke="#0A0E27" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M31.35 10 L17.85 34 L30 34 L28.65 50 L42.15 26 L30 26 Z" fill="url(#boltG)" filter="url(#glow)"/>

  <!-- Q 尾 -->
  <path d="M42 42 L50.5 50.5 L45 54 L38 47 Z" fill="#0A0E27" stroke="#0A0E27" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M42 42 L50.5 50.5 L45 54 L38 47 Z" fill="url(#boltG)"/>

  <!-- 粒子 -->
  <circle cx="9" cy="11" r="1.5" fill="#22D3EE" opacity="0.85"/>
  <circle cx="52" cy="13" r="1.3" fill="#7C3AED" opacity="0.8"/>
</svg>
