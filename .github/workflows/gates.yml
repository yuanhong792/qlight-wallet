name: gates

# 这几道闸在本地跑了一年多，靠的是"有人记得跑"。钉在这儿，push 就执行。
#   ① cargo test --release        —— 共识、账本、发行、网络（166 项）
#   ② tools/wording               —— 8 语言 × 7 字典键集同构 + 禁词 0 命中
#   ③ tools/world/test_docs_parity —— 官网与钱包共用同一份星球网格（逐字节）
#   ④ tools/ui/test_invoke_wiring  —— 每个按钮那句 invoke 对得上 Rust 命令与形参
#   ⑥ tools/world/test_rules_v3    —— 同一条链在任何机器上算出同一片地（像素指纹）
# ⑤ 不是闸，是两条已经真犯过的错：对拍临时页混进发行包、版本号两处字面量各说各话。
# 编号按各道闸"被抓到"的时间排，不重排——⑤ 先落地、⑥ 后加，跑过的日志里就是这个号。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Tauri 在 Linux 上的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl file \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 缓存 cargo 依赖与编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-wallet/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('desktop-wallet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: ① Rust 测试
        working-directory: desktop-wallet
        run: cargo test --release

      - name: ② 口径闸（文案不许诺代码没做的事）
        run: python3 tools/wording/test_wording.py

      - name: ③ 文档对拍闸（官网那份网格与钱包逐字节相同）
        run: python3 tools/world/test_docs_parity.py

      - name: ④ 接线闸（UI 的 invoke 对得上 Rust 命令）
        run: python3 tools/ui/test_invoke_wiring.py

      - name: ⑤ 打包前置（ui/ 里不许有对拍临时页 · 版本两处字面量必须相同）
        run: |
          LEAK="$(find desktop-wallet/ui -name '__*' -print -quit)"
          test -z "$LEAK" || { echo "对拍临时页会跟着进发行包：$LEAK（挪到 dev/）"; exit 1; }
          V="$(awk -F'"' '/^version = /{print $2; exit}' desktop-wallet/Cargo.toml)"
          test -n "$V" || { echo "读不到 Cargo.toml 的 version"; exit 1; }
          grep -q "\"version\": \"$V\"" desktop-wallet/tauri.conf.json \
            || { echo "tauri.conf.json 里没有 Cargo.toml 那个版本 $V——两处字面量各说各话"; exit 1; }
          echo "临时页 0 处 · 版本单一口径 $V"

      - name: ⑥ 世界规则指纹闸（同一条链必须算出同一片地）
        run: python3 tools/world/test_rules_v3.py
