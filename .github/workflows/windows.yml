# QLight Wallet · Windows 云构建
# 手动触发（Actions 页 Run workflow）或推 v* 标签触发
# 产物：单文件绿色版 QLight-Wallet.exe（UI 已编译嵌入，目标机需 WebView2 运行时——Win11 自带）
name: Build Windows Wallet

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo 编译产物，二次构建从十几分钟降到两三分钟
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-wallet

      - name: cargo build --release
        working-directory: desktop-wallet
        run: cargo build --release

      - name: 收集产物
        shell: bash
        run: |
          cp desktop-wallet/target/release/qlight-wallet.exe QLight-Wallet.exe
          mkdir -p bundle
          cp desktop-wallet/target/release/qlight-wallet.exe bundle/QLight-Wallet.exe

      - uses: actions/upload-artifact@v4
        with:
          name: QLight-Wallet-Windows-x64
          path: QLight-Wallet.exe
          if-no-files-found: error
